      border-radius: 1.75rem;

    .video-viewport {
      position: relative;

      background: #000;

      border: 1px solid rgba(245, 158, 11, 0.4);

    .track-item {

    .track-item.active {

    /* IMPROVED PLAYLIST CONTAINER & SCROLLBAR */

    /* Height set so the 4th item peeks out partially */
    .scroll-playlist {
      height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d97706 #16100c;
      -webkit-overflow-scrolling: touch;
    }

    .scroll-playlist::-webkit-scrollbar {
      width: 6px;
      display: block;
    }
    .scroll-playlist::-webkit-scrollbar-track {
      background: rgba(22, 16, 12, 0.8);
      border-radius: 10px;
    }
    .scroll-playlist::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f59e0b, #b45309);
      border-radius: 10px;
      border: 1px solid rgba(254, 243, 199, 0.3);
    }

    /* Bottom Fade Shadow Mask */
    .playlist-scroll-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35px;
      background: linear-gradient(180deg, transparent 0%, rgba(12, 10, 9, 0.95) 100%);
      pointer-events: none;
      border-bottom-left-radius: 1.75rem;
      border-bottom-right-radius: 1.75rem;
      transition: opacity 0.3s ease;

    /* Embedded Category Tabs Styling */
    .cat-pill {

    .cat-pill.active {

      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);

    /* Bottom Metallic Ad Box */

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.9), 0 0 22px rgba(245, 158, 11, 0.25);
    }
  </style>

  <script>
    (function() {
      const playlist = [
        {
          title: "Mujhse Mohabbat Ka",
          artist: "Kumar Sanu, Alka Yagnik",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song1.mp3.mp3"

        },
        {

        },
        {

        },
        {
          title: "Aakhir Tumhein Aana Hai",
          artist: "Udit Narayan, Sapna Mukherjee",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song6.mp3.mp3"
        },
        {
          title: "Tere Mathe Ki Bindiya",
          artist: "Shemaroo Musical",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song7.mp3.mp3"
        },
        {
          title: "Mere Mehboob Qayamat Hogi",
          artist: "Kishore Kumar",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song8.mp3.mp3"
        },
        {
          title: "Dil Ne Yeh Kaha Hain Dil Se",
          artist: "Udit Narayan, Alka Yagnik, Sonu Nigam",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song9.mp3.mp3"
        },
        {
          title: "Tere Ishq Mein Naachenge",
          artist: "Udit Narayan",
          category: "hindi",
          src: "https://archive.org/download/song5.mp3/songs/song10.mp3.mp3"
        }
      ];

      const audio = document.getElementById('audioPlayer');
      const hornAudio1 = document.getElementById('hornAudioPlayer1');
      const hornAudio2 = document.getElementById('hornAudioPlayer2');
      
      const playPauseBtn = document.getElementById('playPauseBtn');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const rewindBtn = document.getElementById('rewindBtn');
      const forwardBtn = document.getElementById('forwardBtn');
      const trackTitleSpan = document.getElementById('nowPlayingTitle');
      const trackArtistSpan = document.getElementById('nowPlayingArtist');
      const seekSlider = document.getElementById('seekSlider');
      const currentTimeSpan = document.getElementById('currentTime');
      const durationSpan = document.getElementById('duration');
      const trackListContainer = document.getElementById('trackList');
      const playlistContainer = document.getElementById('playlistContainer');
      const scrollHintOverlay = document.getElementById('scrollHintOverlay');
      const trackCountBadge = document.getElementById('trackCountBadge');
      const categoryButtons = document.querySelectorAll('.cat-pill');
      
      const horn1Btn = document.getElementById('horn1Btn');
      const horn2Btn = document.getElementById('horn2Btn');

      let currentTrackIndex = 0;
      let isPlaying = false;
      let currentFilter = 'all';
      let filteredIndices = [];

      function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      }

      function updateFilteredIndices() {
        filteredIndices = [];
        playlist.forEach((track, idx) => {
          if (currentFilter === 'all' || track.category === currentFilter) {
            filteredIndices.push(idx);
          }
        });

        // Update badge text dynamically
        if (trackCountBadge) {
          trackCountBadge.innerHTML = filteredIndices.length > 3 
            ? `${filteredIndices.length} Tracks • Scroll ⇣` 
            : `${filteredIndices.length} Tracks`;
        }

        if (filteredIndices.length > 0 && !filteredIndices.includes(currentTrackIndex)) {
          currentTrackIndex = filteredIndices[0];
          loadTrack(currentTrackIndex, false);
        }
        renderTrackList();
        checkScrollOverlay();
      }

      function renderTrackList() {
        trackListContainer.innerHTML = '';
        if (filteredIndices.length === 0) {
          trackListContainer.innerHTML = '<div class="text-center text-stone-500 py-3 text-xs">No tracks found</div>';
          return;
        }
        filteredIndices.forEach((idx) => {
          const track = playlist[idx];
          const isActive = (idx === currentTrackIndex);
          const div = document.createElement('div');
          div.className = `track-item flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs ${isActive ? 'active' : ''}`;
          div.dataset.index = idx;
          div.innerHTML = `
            <div class="flex items-center gap-2.5 min-w-0">
              <i class="fas ${isActive && isPlaying ? 'fa-volume-up text-amber-400' : 'fa-music text-stone-500'} w-4"></i>
              <div class="truncate">
                <div class="font-semibold text-stone-200 truncate">${track.title}</div>
                <div class="text-[10px] text-stone-400 truncate">${track.artist}</div>
              </div>
            </div>
            <span class="text-[9px] uppercase px-2 py-0.5 rounded bg-stone-900 text-stone-400 border border-stone-800">${track.category}</span>
          `;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            const newIndex = parseInt(div.dataset.index);
            if (newIndex !== currentTrackIndex) {
              currentTrackIndex = newIndex;
              loadTrack(currentTrackIndex, true);
            } else {
              togglePlayPause();
            }
          });
          trackListContainer.appendChild(div);
        });
      }

      function checkScrollOverlay() {
        if (!playlistContainer || !scrollHintOverlay) return;
        const isScrollable = playlistContainer.scrollHeight > playlistContainer.clientHeight;
        const isAtBottom = playlistContainer.scrollHeight - playlistContainer.scrollTop <= playlistContainer.clientHeight + 10;
        
        if (isScrollable && !isAtBottom) {
          scrollHintOverlay.style.opacity = '1';
        } else {
          scrollHintOverlay.style.opacity = '0';
        }
      }

      if (playlistContainer) {
        playlistContainer.addEventListener('scroll', checkScrollOverlay);
      }

      function loadTrack(index, autoPlay = false) {
        if (index < 0 || index >= playlist.length) return;
        const track = playlist[index];
        audio.src = track.src;
        trackTitleSpan.textContent = track.title;
        trackArtistSpan.textContent = track.artist;
        currentTrackIndex = index;
        renderTrackList();

        if (autoPlay) {
          audio.play().then(() => {
            isPlaying = true;
            updatePlayPauseIcon();
          }).catch(() => {
            isPlaying = false;
            updatePlayPauseIcon();
          });
        } else {
          if (!audio.paused) {
            audio.pause();
            isPlaying = false;
            updatePlayPauseIcon();
          }
        }
        seekSlider.value = 0;
        currentTimeSpan.textContent = '0:00';
      }

      function updatePlayPauseIcon() {
        playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
        renderTrackList();
      }

      function togglePlayPause() {
        if (audio.src === '' || audio.src === window.location.href) {
          if (filteredIndices.length > 0) {
            currentTrackIndex = filteredIndices[0];
            loadTrack(currentTrackIndex, true);
          }
          return;
        }
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        } else {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(() => {
            isPlaying = false;
          });
        }
        updatePlayPauseIcon();
      }

      function playNext() {
        if (filteredIndices.length === 0) return;
        const currentPos = filteredIndices.indexOf(currentTrackIndex);
        let nextPos = (currentPos + 1) % filteredIndices.length;
        currentTrackIndex = filteredIndices[nextPos];
        loadTrack(currentTrackIndex, true);
      }

      function playPrev() {
        if (filteredIndices.length === 0) return;
        const currentPos = filteredIndices.indexOf(currentTrackIndex);
        let prevPos = (currentPos - 1 + filteredIndices.length) % filteredIndices.length;
        currentTrackIndex = filteredIndices[prevPos];
        loadTrack(currentTrackIndex, true);
      }

      audio.addEventListener('timeupdate', () => {
        if (!isNaN(audio.duration)) {
          const percent = (audio.currentTime / audio.duration) * 100;
          seekSlider.value = percent;
          currentTimeSpan.textContent = formatTime(audio.currentTime);
          durationSpan.textContent = formatTime(audio.duration);
        }
      });

      audio.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = formatTime(audio.duration);
        seekSlider.value = 0;
        currentTimeSpan.textContent = '0:00';
      });

      audio.addEventListener('ended', playNext);
      audio.addEventListener('pause', () => { isPlaying = false; updatePlayPauseIcon(); });
      audio.addEventListener('play', () => { isPlaying = true; updatePlayPauseIcon(); });

      seekSlider.addEventListener('input', (e) => {
        if (!isNaN(audio.duration)) {
          audio.currentTime = (e.target.value / 100) * audio.duration;
        }
      });

      playPauseBtn.addEventListener('click', togglePlayPause);
      nextBtn.addEventListener('click', playNext);
      prevBtn.addEventListener('click', playPrev);

      rewindBtn.addEventListener('click', () => {
        audio.currentTime = Math.max(0, audio.currentTime - 3);
      });

      forwardBtn.addEventListener('click', () => {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 3);
      });

      categoryButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          categoryButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.cat;
          updateFilteredIndices();
        });
      });

      // Exclusive Horn Audio Handlers
      horn1Btn.addEventListener('click', () => {
        hornAudio2.pause();
        hornAudio2.currentTime = 0;
        
        hornAudio1.currentTime = 0;
        hornAudio1.play().catch(e => console.log("Horn 1 play error:", e));
      });

      horn2Btn.addEventListener('click', () => {
        hornAudio1.pause();
        hornAudio1.currentTime = 0;

        hornAudio2.currentTime = 0;
        hornAudio2.play().catch(e => console.log("Horn 2 play error:", e));
      });

      function init() {
        currentFilter = 'all';
        updateFilteredIndices();
        if (filteredIndices.length > 0) {
          currentTrackIndex = filteredIndices[0];
          loadTrack(currentTrackIndex, false);
        }
        updatePlayPauseIcon();
      }

      init();
    })();
  </script>
</body>
